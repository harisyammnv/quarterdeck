[workspace]
resolver = "2"
members = ["core", "app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[workspace.dependencies]
quarterdeck-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util", "fs"] }
notify = "8.2"
time = { version = "0.3", features = ["parsing", "macros"] }
tempfile = "3"
bollard = { version = "0.21.1", default-features = false, features = ["pipe"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Typed IPC: tauri-specta 2.0.0-rc.29 requires exactly this specta release.
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "=0.0.15"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
tauri = { version = "~2.12", features = ["specta"] }
tauri-build = { version = "2.7", features = [] }
# Native folder picker for choosing the Firstmate home, driven from Rust only (no webview permission).
tauri-plugin-dialog = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
