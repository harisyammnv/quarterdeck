[package]
name = "quarterdeck"
description = "Quarterdeck desktop app: a read-only window onto a Firstmate fleet."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "quarterdeck"

[lib]
name = "quarterdeck_app"
crate-type = ["rlib"]

[[bin]]
name = "quarterdeck"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
quarterdeck-core = { workspace = true, features = ["specta"] }
tauri.workspace = true
tauri-specta.workspace = true
specta.workspace = true
specta-typescript.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[lints]
workspace = true
